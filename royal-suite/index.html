<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Mobile & Printing Store</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#d4af37"><meta name="description" content="Royal Mobile & Printing Store Faisalabad - mobile accessories, printing, gifts, stationery. Fast Delivery All over Pakistan."><meta property="og:title" content="Royal Mobile & Printing Store"><meta property="og:description" content="Fast Delivery All over Pakistan."><meta property="og:type" content="website">
<style>
:root{--bg:#0b0b0b;--card:#1a1a1a;--ac:#d4af37;--tx:#f5f1e6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:2px solid var(--ac);position:sticky;top:0;z-index:5}
header img{height:42px;border-radius:6px}.brand{font-weight:700;color:var(--ac);flex:1;font-size:15px}
.cover{height:120px;background:#222 center/cover;display:flex;align-items:end;padding:10px;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px}nav button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--ac);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
nav button.on,.btn.p{background:var(--ac);color:#000;font-weight:700}
main{padding:10px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;perspective:900px}
.card{background:var(--card);border-radius:12px;padding:10px;border:1px solid #0003;box-shadow:0 6px 0 #0006,0 14px 24px #0008;transition:transform .15s;transform-style:preserve-3d}
.card:hover{transform:rotateX(4deg) rotateY(-4deg) translateZ(10px)}
.ic{font-size:42px;text-align:center}input,select,textarea{background:#fff1;color:var(--tx);border:1px solid #888;border-radius:6px;padding:7px;width:100%;margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #444;padding:5px;text-align:left}
.hl{background:#d4af3733;outline:2px solid var(--ac)}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.k{font-size:22px;color:var(--ac);font-weight:700}.msg{padding:8px;border-radius:8px;margin:4px 0;background:#fff1}.me{background:#d4af3733}
</style></head><body>
<header><img id="lg" alt=""><div class="brand" id="bn"></div><button class="btn" onclick="L()">EN/اردو</button><button class="btn p" onclick="go('cart')">🛒 <span id="cc">0</span></button></header>
<div class="cover" id="cv"></div><nav id="nv"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s),P=n=>'Rs '+Math.round(n).toLocaleString();
const T=[["Royal Gold","#0b0b0b","#1a1a1a","#d4af37"],["Midnight","#0a0f1f","#16203a","#5ea0ff"],["Emerald","#07140e","#10261a","#2ecc71"],["Ruby","#150708","#2a1013","#ff4d5e"],["Violet","#0f0a1a","#1e1433","#b07cff"],["Ocean","#04141a","#0b2b36","#19c6e6"],["Sunset","#1a0f07","#33200f","#ff8c1a"],["Rose","#1a0a10","#33142080","#ff6fa5"],["Forest","#0a120a","#16261a","#8bc34a"],["Steel","#101214","#1f2328","#9fb3c8"],["Candy","#1a0a1a","#331433","#ff5fd2"],["Desert","#1a1408","#332810","#e6b86a"],["Ice","#e9f3fa","#ffffff","#1769aa"],["Paper","#f6f1e7","#fffaf0","#8a5a00"],["Neon","#050505","#101010","#39ff14"],["Cyber","#0a0614","#180d2b","#00f0ff"],["Coffee","#150e0a","#2a1d15","#c69c6d"],["Mint","#06151a","#0e2a2e","#4de0c0"],["Crimson","#0d0d0d","#240a0a","#dc143c"],["Sky","#eaf6ff","#ffffff","#0288d1"]];
const C=[["📱","Mobile & Accessories"],["🖨️","DTF & Sublimation"],["✂️","Plotter & Vinyl Cutting"],["💎","Rhinestone Printing"],["📚","Stationery & Office"],["🔷","Acrylic & Laser Cutting"],["🎁","Customized Gifts"],["🪧","Banners & Signage"],["🛍️","Packaging & Bags"],["🪪","PVC & ID Cards"],["📄","Offset Printing"],["💻","Computer & Digital"],["💒","Wedding & Event Cards"],["🔖","Stamps & Embossing"],["🖼️","Photo Printing & Frames"],["☕","Mugs & T-Shirts"]];
const N=["Basic","Premium","Custom","Deluxe","Mini","Large","Pro","Set"];
const gen=()=>{let a=[],i=1;C.forEach((c,ci)=>N.forEach(n=>{let p=200+((i*137)%4800);a.push({id:i,sku:'RMP'+String(i).padStart(4,'0'),name:c[1]+' '+n,cat:ci,price:p,cost:Math.round(p*.7),stock:5+i%40,img:'',custom:ci>0&&ci!=4});i++}));return a};
let S=JSON.parse(localStorage.rms||'null')||{p:gen(),o:[],cu:[{n:'Walk-in',ph:'',bal:0}],ex:[],cart:[],th:0,lg:'',cv:'',ur:0,api:'',au:0,own:'#d4af37',bgc:''};
const sv=()=>localStorage.rms=JSON.stringify(S);
let tab='shop',sub='dash',q='',cf=-1,ch=[];
const TABS=[['shop','🏬 Shop','دکان'],['cart','🛒 Cart','کارٹ'],['admin','⚙️ Admin','ایڈمن'],['pos','🧾 POS','پی او ایس'],['ai','🤖 Farhan AI','فرحان اے آئی'],['soc','📣 Social','سوشل']];
const go=t=>{tab=t;R()};const L=()=>{S.ur=!S.ur;sv();R()};
function theme(){let t=T[S.th];let r=document.documentElement.style;r.setProperty('--bg',S.bgc||t[1]);r.setProperty('--card',t[2]);r.setProperty('--ac',S.own||t[3]);r.setProperty('--tx',/^#[ef]/.test(t[1])?'#111':'#f5f1e6');document.documentElement.dir=S.ur?'rtl':'ltr'}
function R(){theme();$('#lg').src=S.lg||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42"><text x="5" y="30" font-size="28">👑</text></svg>');
$('#bn').innerHTML='ROYAL MOBILE & PRINTING STORE<br><small>Farhan Abbas • Faisalabad • +92 304 0011041</small>';
$('#cv').style.backgroundImage=S.cv?`url(${S.cv})`:'none';$('#cv').textContent='Fast Delivery All over Pakistan.';
$('#cc').textContent=S.cart.reduce((a,b)=>a+b.q,0);
$('#nv').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${S.ur?t[2]:t[1]}</button>`).join('');
$('#m').innerHTML=({shop,cart,admin,pos,ai,soc})[tab]();}
function shop(){let l=S.p.filter(p=>(cf<0||p.cat==cf)&&(p.name+p.sku).toLowerCase().includes(q.toLowerCase()));
return `<input placeholder="Search / SKU" value="${q}" oninput="q=this.value;R();this.focus()"><select onchange="cf=+this.value;R()"><option value=-1>All categories</option>${C.map((c,i)=>`<option value=${i} ${cf==i?'selected':''}>${c[0]} ${c[1]}</option>`).join('')}</select><div class="grid">${l.map(p=>`<div class="card"><div class="ic">${p.img?`<img src="${p.img}" width=80>`:C[p.cat][0]}</div><b>${p.name}</b><div class="k">${P(p.price)}</div><small>${p.stock>0?'Stock '+p.stock:'Out'}</small><br><button class="btn p" onclick="add(${p.id})">Add</button></div>`).join('')}</div>`}
function add(id,n=1){let i=S.cart.find(x=>x.id==id);i?i.q+=n:S.cart.push({id,q:n});sv();R()}
function cart(){let t=0;let rows=S.cart.map(c=>{let p=S.p.find(x=>x.id==c.id);t+=p.price*c.q;return `<tr><td>${p.name}</td><td>${c.q}</td><td>${P(p.price*c.q)}</td><td><button class="btn" onclick="S.cart=S.cart.filter(x=>x.id!=${c.id});sv();R()">✕</button></td></tr>`}).join('');
return `<table>${rows}</table><div class="k">Total ${P(t)}</div><div class="row"><input id="cn" placeholder="Name"><input id="cp" placeholder="Phone"></div><input id="ca" placeholder="Address / City"><select id="pm"><option>COD</option><option>JazzCash</option><option>Easypaisa</option><option>Bank Transfer</option><option>Udhaar</option></select><button class="btn p" onclick="chk(${t})">Place Order</button>`}
function mk(items,cust,pm,src,hl){let t=items.reduce((a,i)=>a+S.p.find(p=>p.id==i.id).price*i.q,0);items.forEach(i=>S.p.find(p=>p.id==i.id).stock-=i.q);
let o={no:'RMP-'+(1001+S.o.length),d:new Date().toLocaleString(),items,cust,pm,total:t,st:'New',src,hl};S.o.unshift(o);
if(pm=='Udhaar'){let c=S.cu.find(x=>x.n==cust)||(S.cu.push({n:cust,ph:'',bal:0}),S.cu.at(-1));c.bal+=t}sv();return o}
function chk(t){if(!S.cart.length)return;let n=$('#cn').value||'Guest';let o=mk(S.cart,n,$('#pm').value,'Web');S.cart=[];sv();alert('Order '+o.no+' placed. Track in Admin > Orders.');go('shop')}
function admin(){let s=['dash','prod','ord','acc','set'];let nm={dash:'Dashboard',prod:'Products',ord:'Orders',acc:'Accounts',set:'Customize'};
return `<div class="row">${s.map(x=>`<button class="btn ${sub==x?'p':''}" onclick="sub='${x}';R()">${nm[x]}</button>`).join('')}</div>`+({dash,prod,ord,acc,set})[sub]()}
const rev=()=>S.o.reduce((a,o)=>a+o.total,0),cst=()=>S.o.reduce((a,o)=>a+o.items.reduce((b,i)=>b+S.p.find(p=>p.id==i.id).cost*i.q,0),0),exp=()=>S.ex.reduce((a,e)=>a+e.a,0);
function dash(){let low=S.p.filter(p=>p.stock<8);return `<div class="row"><div class="card">Sales<div class="k">${P(rev())}</div></div><div class="card">Orders<div class="k">${S.o.length}</div></div><div class="card">Profit<div class="k">${P(rev()-cst()-exp())}</div></div><div class="card">Low stock<div class="k">${low.length}</div></div></div><h4>Low-stock alerts</h4>${low.slice(0,10).map(p=>`<div>${p.sku} ${p.name} — ${p.stock}</div>`).join('')}<h4>Auto Order (5 pcs)</h4><div class="row"><select id="ap">${S.p.map(p=>`<option value=${p.id}>${p.name}</option>`).join('')}</select><select id="as"><option value=1>Scale 1x (5 pcs)</option><option value=2>2x (10 pcs)</option><option value=5>5x (25 pcs)</option></select><button class="btn p" onclick="auto()">Generate</button></div><p><button class="btn" onclick="exp_()">Export backup</button> <input type="file" accept=".json" onchange="imp(this)"></p>`}
function auto(){let id=+$('#ap').value,k=+$('#as').value;mk([{id,q:5*k}],'Auto Customer','COD','Auto',true);sub='ord';R()}
function prod(){return `<button class="btn p" onclick="np()">+ Add Product</button><table><tr><th>SKU<th>Name<th>Price<th>Stock<th></tr>${S.p.map(p=>`<tr><td>${p.sku}<td>${p.name}<td>${P(p.price)}<td>${p.stock}<td><button class="btn" onclick="ep(${p.id})">Edit</button><button class="btn" onclick="S.p=S.p.filter(x=>x.id!=${p.id});sv();R()">✕</button></tr>`).join('')}</table>`}
function np(){let n=prompt('Product name');if(!n)return;let id=Math.max(...S.p.map(p=>p.id))+1;S.p.unshift({id,sku:'RMP'+String(id).padStart(4,'0'),name:n,cat:+(prompt('Category 0-'+(C.length-1)+'\n'+C.map((c,i)=>i+'='+c[1]).join(', '))||0),price:+prompt('Retail price')||0,cost:+prompt('Cost price')||0,stock:+prompt('Stock')||0,img:'',custom:true});sv();R()}
function ep(id){let p=S.p.find(x=>x.id==id);p.name=prompt('Name',p.name)||p.name;p.price=+prompt('Price',p.price)||p.price;p.stock=+prompt('Stock',p.stock);let f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>rd(f,v=>{p.img=v;sv();R()});if(confirm('Change product image too?'))f.click();sv();R()}
const rd=(f,cb)=>{let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f.files[0])};
const STS=['New','Processing','Printing','Shipped','Delivered','Returned'];
function ord(){return `<table><tr><th>No<th>Customer<th>Total<th>Pay<th>Status</tr>${S.o.map((o,i)=>`<tr class="${o.hl?'hl':''}"><td>${o.no}${o.hl?' ⭐':''}<td>${o.cust}<td>${P(o.total)}<td>${o.pm}<td><select onchange="S.o[${i}].st=this.value;sv()">${STS.map(s=>`<option ${s==o.st?'selected':''}>${s}</option>`).join('')}</select> <button class="btn" onclick="rc(${i})">🧾</button></tr>`).join('')}</table>`}
function rc(i){let o=S.o[i],w=open('','_blank');w.document.write(`<pre style="font:14px monospace;width:300px">ROYAL MOBILE & PRINTING STORE\nFaisalabad | 0304 0011041\n${o.no} ${o.d}\n--------------\n${o.items.map(x=>{let p=S.p.find(a=>a.id==x.id);return p.name+' x'+x.q+'  '+P(p.price*x.q)}).join('\n')}\n--------------\nTOTAL ${P(o.total)}  (${o.pm})\nThank you!</pre>`);w.print()}
function acc(){return `<div class="row"><div class="card">Income<div class="k">${P(rev())}</div></div><div class="card">COGS<div class="k">${P(cst())}</div></div><div class="card">Expenses<div class="k">${P(exp())}</div></div><div class="card">P&L<div class="k">${P(rev()-cst()-exp())}</div></div></div><button class="btn p" onclick="ax()">+ Expense</button>${S.ex.map(e=>`<div>${e.d} ${e.t}: ${P(e.a)}</div>`).join('')}<h4>Customer Ledger / Udhaar</h4>${S.cu.map(c=>`<div>${c.n}: ${P(c.bal)} <button class="btn" onclick="c=S.cu.find(x=>x.n=='${c.n}');c.bal-=+prompt('Payment received')||0;sv();R()">Receive</button></div>`).join('')}`}
function ax(){let t=prompt('Expense title'),a=+prompt('Amount');if(t&&a){S.ex.push({t,a,d:new Date().toLocaleDateString()});sv();R()}}
function set(){return `<h4>Logo (use your original black-gold logo)</h4><input type="file" accept="image/*" onchange="rd(this,v=>{S.lg=v;sv();R()})"><h4>Cover picture</h4><input type="file" accept="image/*" onchange="rd(this,v=>{S.cv=v;sv();R()})"><h4>20 Themes (3D cards)</h4><div class="row">${T.map((t,i)=>`<button class="btn ${S.th==i?'p':''}" onclick="S.th=${i};S.own='';S.bgc='';sv();R()">${t[0]}</button>`).join('')}</div><h4>Manual colours</h4><div class="row"><label>Accent<input type="color" value="${S.own.length==7?S.own:'#d4af37'}" onchange="S.own=this.value;sv();R()"></label><label>Background<input type="color" value="#0b0b0b" onchange="S.bgc=this.value;sv();R()"></label></div><h4>AI API URL (your Cloudflare Worker)</h4><input value="${S.api}" placeholder="https://royal-mobile-store-api.sa341920.workers.dev/ai" onchange="S.api=this.value;sv()">`}
function pos(){return `<h4>POS / Barcode</h4><input id="bc" placeholder="Scan barcode or type SKU, press Enter" onkeydown="if(event.key=='Enter'){let p=S.p.find(x=>x.sku.toLowerCase()==this.value.toLowerCase());p?add(p.id):alert('Not found');this.value=''}" autofocus>${cart()}`}
function ai(){return `<select id="md"><option>Cloudflare AI</option><option>ChatGPT</option><option>Gemini</option><option>DeepSeek</option></select><div id="ch">${ch.map(m=>`<div class="msg ${m[0]?'me':''}">${m[1]}</div>`).join('')}</div><input id="aq" placeholder="Ask: sales report, low stock, caption, reply to customer..." onkeydown="if(event.key=='Enter')ask()"><button class="btn p" onclick="ask()">Send</button>`}
async function ask(){let v=$('#aq').value;if(!v)return;let m=$('#md').value;ch.push([1,v]);let r;
if(S.api){try{r=(await(await fetch(S.api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:m,prompt:v,context:{sales:rev(),orders:S.o.length}})})).json());r=r.reply||r.response||JSON.stringify(r)}catch(e){r='API error: '+e.message}}
else{let l=v.toLowerCase();r=/sale|report|profit/.test(l)?`Sales ${P(rev())}, orders ${S.o.length}, profit ${P(rev()-cst()-exp())}.`:/stock/.test(l)?'Low stock: '+S.p.filter(p=>p.stock<8).slice(0,8).map(p=>p.name).join(', '):'Offline mode: set your Worker API URL in Admin > Customize for '+m+' answers.'}
ch.push([0,r]);R()}
function soc(){return `<select id="sp">${S.p.map(p=>`<option value=${p.id}>${p.name}</option>`).join('')}</select><textarea id="st" rows=4 placeholder="Caption (blank = auto)"></textarea><div class="row">${['WhatsApp','Facebook','Telegram','X','Instagram','TikTok','YouTube'].map(n=>`<button class="btn" onclick="sh('${n}')">${n}</button>`).join('')}</div><small>Instagram/TikTok/YouTube: caption copy hota hai, phir app mein paste karein.</small>`}
function sh(n){let p=S.p.find(x=>x.id==$('#sp').value),t=$('#st').value||`${p.name} sirf ${P(p.price)} mein! Royal Mobile & Printing Store, Faisalabad. Fast Delivery All over Pakistan. WhatsApp: +92 304 0011041`,u=encodeURIComponent(t),pg=encodeURIComponent(location.href);
let l={WhatsApp:'https://wa.me/?text='+u,Facebook:'https://www.facebook.com/sharer/sharer.php?u='+pg+'&quote='+u,Telegram:'https://t.me/share/url?url='+pg+'&text='+u,X:'https://twitter.com/intent/tweet?text='+u}[n];
l?open(l):(navigator.clipboard.writeText(t),alert('Caption copied for '+n))}
const exp_=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download='royal-backup.json';a.click()};
const imp=f=>{let r=new FileReader();r.onload=()=>{S=JSON.parse(r.result);sv();R()};r.readAsText(f.files[0])};
R();
</script><script src="addon.js"></script><script src="addon2.js"></script><script src="addon3.js"></script><script src="addon4.js"></script><script src="addon5.js"></script><script src="addon6.js"></script></body></html>
